services:
  - type: web
    name: flash-card
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn FLASHCARDS2.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value:
      - key: ALLOWED_HOSTS
        value: .onrender.com